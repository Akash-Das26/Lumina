  # drizzle-kit uses esbuild internally on an older version that's vulnerable
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # BUG-011 (GHSA-g7r4-m6w7-qqqr): >=0.27.3 was itself in the advisory range
  # for a Windows dev-server file-read; 0.28.2 is the first patched release.
  esbuild: "0.28.2"

allowBuilds:
  esbuild: true