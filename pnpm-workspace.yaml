# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g., an urgent security bugfix), you can add it to the
# minimumReleaseAgeExclude allowlist below. Only consider this for packages
# released by trusted organizations.
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^4.0.0

autoInstallPeers: false

overrides:
  # SECURITY: patched versions for known-vulnerable transitive packages
  # (same-major bumps only; keep in sync with `pnpm audit` output)
  brace-expansion: 5.0.12
  fast-uri: 3.1.8
  js-yaml: 4.3.2
  markdown-it: 14.3.1
  nanoid: 3.3.18
  # BUG-011: advisories published after Audit 3
  # proxy-addr is a production dependency of express/express-rate-limit; the
  # fix matters because it defeats IP spoofing behind a trusted proxy
  # (relevant to the F-02 rate-limit keying).
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  fast-copy: 4.1.0
  # Dev-only advisory (GHSA-rj75-hqrm-r3gf): @tailwindcss/typography pins
  # postcss-selector-parser@6.0.10, which has quadratic selector parsing.
  # 7.1.6 is a major bump; verified the Tailwind build still emits prose
  # styles with it. Remove once @tailwindcss/typography ships >=7.
  postcss-selector-parser: 7.1.6
  # Prune unused platform binaries (keeps installs lean)
  "esbuild>@esbuild/darwin-arm64": "-"
  "esbuild>@esbuild/darwin-x64": "-"
  "esbuild>@esbuild/freebsd-arm64": "-"
  "esbuild>@esbuild/freebsd-x64": "-"
