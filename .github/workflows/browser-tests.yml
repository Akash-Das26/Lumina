# Browser verification harnesses for the Lumina web app.
#
# `pnpm verify:lightbox` — the ImageLightbox in a real browser (mouse, keyboard,
# touch, gallery navigation).
# `pnpm verify:flow` — an ephemeral full stack (PostgreSQL, API, Vite, stub
# provider) driven through sign-up, an Artist conversation and image generation.
#
# The `test` step also runs the 4 env-gated integration tests
# (`artifacts/api-server/test/integration.pagination.spec.ts`): they are gated on
# `E2E_DATABASE_URL`, which is set here from the `postgres` service below, so the
# real-SQL pagination and image-ownership paths run on every PR instead of being
# skipped. Locally the variable stays unset, so `pnpm test` stays hermetic.
#
# Requires:
#   node 22 (with global WebSocket for CDP)
#   Google Chrome/Chromium (the workflow installs it)
#   PostgreSQL 12+ for the full flow (`sudo apt-get install postgresql`)

name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_MAJOR: 22

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm
          cache-dependency-path: pnpm-workspace.yaml

      - name: Install pnpm
        run: corepack enable && pnpm --version

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint recommended + TypeScript + React hooks)
        run: pnpm lint

      - name: Apply the schema to the service database
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: pnpm db:push

      - name: Install Google Chrome
        run: |
          curl -fsSLo /usr/share/keyrings/google-chrome-keyring.gpg \
            https://dl-ssl.google.com/linux/linuxsigning-key.pub
          echo "deb [signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] \
            http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Unit and component tests (Audit 3 F-01 / BUG-006)
        env:
          # Turns the 4 env-gated integration tests on (they skip when unset).
          E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: pnpm test

      - name: Build typecheck + lightbox harness (no Postgres needed)
        run: |
          pnpm run typecheck
          pnpm run verify:lightbox

      - name: Build full flow (needs PostgreSQL on port 5432)
        env:
          PGHOST: localhost
          PGDATABASE: postgres
          PGUSER: postgres
        run: |
          pnpm run verify:flow

      - name: Upload harness artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-logs
          path: |
            /tmp/lumina-lightbox-*
            /tmp/lumina-flow-*
          retention-days: 3
